name: Solution Quality Assurance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-api-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend/requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q backend frontend

      - name: Validate JSON configuration and report schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              *Path("backend/config").glob("*.json"),
              *Path("docs/schemas").glob("*.json"),
              *Path("docs/examples").glob("*.json"),
              *Path("frontend/mock_data").glob("*.json"),
          ]
          assert paths, "No JSON fixtures or schemas were found"
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"Validated {len(paths)} JSON documents")
          PY

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r frontend/requirements.txt
          pip check

      - name: Smoke-test API health endpoint (offline)
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from main import app
          with TestClient(app) as client:
              response = client.get("/health")
          assert response.status_code == 200, response.text
          payload = response.json()
          assert payload.get("status") == "ok", payload
          print("FastAPI /health smoke test passed")
          PY
